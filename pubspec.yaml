name: factory_management
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_bloc: ^9.1.1
  bloc: ^9.0.0
  equatable: ^2.0.7
  rxdart: ^0.28.0

  # Functional Programming
  dartz: ^0.10.1

  # Routing
  go_router: ^17.5.0

  # Dependency Injection
  get_it: ^9.2.1

  # Networking
  dio: ^5.9.0
  pretty_dio_logger: ^1.4.0

  # Models
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # UI
  google_fonts: ^8.2.1
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.2.0
  fl_chart: ^1.2.0
  animate_do: ^5.1.0
  font_awesome_flutter: ^11.0.0

  # Local Storage
  shared_preferences: ^2.5.3

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  build_runner: ^2.5.4
  freezed: ^3.2.0
  json_serializable: ^6.9.5

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/logos/
    - assets/animations/
    - assets/fonts/
